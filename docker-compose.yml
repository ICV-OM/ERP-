services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: alturud_hr
      POSTGRES_USER: alturud
      POSTGRES_PASSWORD: replace_me
    ports:
      - "5432:5432"
    volumes:
      - alturud_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alturud -d alturud_hr"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  alturud_pg:
